    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Holy Quran" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://holy-quran.app/" />
    <meta property="og:title" content="Holy Quran — Read, Search & Memorize the Quran Online" />
    <meta property="og:description" content="Read, search, and memorize the Holy Quran online. All 114 Surahs with Arabic text, translations, tajweed highlighting, audio recitation, and a Hifz memorization tracker." />
    <meta property="og:image" content="https://holy-quran.app/og-image.png" />

    <meta name="twitter:image" content="https://holy-quran.app/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.alquran.cloud" />
    <link
      href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@300..700&display=swap"
      rel="stylesheet"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Holy Quran",
        "url": "https://holy-quran.app/",
        "description": "Read, search, and memorize the Holy Quran online.",
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://holy-quran.app/search?q={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        }
      }
    </script>

    <!-- SPA redirect handler for GitHub Pages -->
    <script>
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
